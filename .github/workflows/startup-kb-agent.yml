name: Startup KB Agent

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "43 7 * * *"
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Refresh all YC datasets before checking them
        required: false
        default: false
        type: boolean

concurrency:
  group: startup-kb-agent
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test tools
        run: python -m pip install --upgrade pip && python -m pip install -e . pytest

      - name: Refresh public YC data
        if: github.event.schedule == '43 7 * * *' || inputs.refresh_data == true
        run: |
          ycombinator fetch all --force
          ycombinator fetch mirror

      - name: Test package
        run: python -m pytest -q

      - name: Build role-based YC index
        run: ycombinator role-index

      - name: Run agent heartbeat
        run: |
          ycombinator agent --format json --output agent-report.json
          ycombinator agent --format markdown --output agent-report.md
          cat agent-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish heartbeat artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: startup-kb-agent-${{ github.run_id }}
          path: agent-report.*
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit verified data refresh
        if: github.event.schedule == '43 7 * * *' || inputs.refresh_data == true
        run: |
          git config user.name "startup-kb-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datasets/yc-companies datasets/yc-oss-mirror datasets/yc-role-index.json datasets/yc-role-index.md
          if git diff --cached --quiet; then
            echo "No upstream data changes."
          else
            git commit -m "chore(data): refresh YC directory"
            git push origin HEAD:main
          fi

      - name: Close resolved incident
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[KB Agent] Heartbeat failed';
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            for (const issue of issues.filter(item => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in run ${context.runId}. Closing this incident.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed'
              });
            }

  incident:
    if: always() && needs.heartbeat.result == 'failure'
    needs: heartbeat
    runs-on: ubuntu-latest
    steps:
      - name: Create or update incident
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[KB Agent] Heartbeat failed';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The always-on startup KB heartbeat failed. Inspect ${runUrl}.`;
            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(item => item.title === title && !item.pull_request);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }
